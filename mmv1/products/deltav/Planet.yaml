---
name: 'Planet'
description: |
  A set of reusable connection configurations to be used as a source or destination for a stream.
references:
  guides:
    'Official Documentation': 'https://cloud.google.com/datastream/docs/create-connection-profiles'
  api: 'https://cloud.google.com/datastream/docs/reference/rest/v1/projects.locations.connectionProfiles'
api_version: "2024-04-11-preview"
id_format: 'projects/{{project}}/locations/{{location}}/planets/{{planet_id}}'
base_url: 'projects/{{project}}/locations/{{location}}/planets'
self_link: 'projects/{{project}}/locations/{{location}}/planets/{{planet_id}}'
create_url: 'projects/{{project}}/locations/{{location}}/planets?planet_id={{planet_id}}'
update_verb: 'PATCH'
update_mask: true
import_format:
  - 'projects/{{project}}/locations/{{location}}/planets/{{planet_id}}'
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
autogen_async: true
async:
  operation:
    timeouts:
      insert_minutes: 20
      update_minutes: 20
      delete_minutes: 20
    base_url: '{{op_id}}'
  actions:
  - create
  - delete
  - update
  type: OpAsync
  result:
    resource_inside_response: true
  error: {}
  include_project: false
custom_code:
examples:
  - name: 'planet_basic'
    primary_resource_id: 'default'
    vars:
      connection_profile_id: 'my-profile'
parameters:
  - name: 'planetId'
    type: String
    description: |-
      The connection profile identifier.
    url_param_only: true
    required: true
    immutable: true
  - name: 'location'
    type: String
    description: |-
      The connection profile identifier.
    url_param_only: true
    required: true
    immutable: true
properties:
  - name: 'name'
    type: String
    description: |-
      The connection profile identifier.
    ignore_read: true
  - name: 'celestialFacts'
    type: NestedObject
    description: |
      Source connection profile configuration.
    required: true
    properties:
      - name: 'mass'
        type: Double
        description: |
          Source connection profile resource. Format: projects/{project}/locations/{location}/connectionProfiles/{name}
        required: true