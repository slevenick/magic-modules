---
name: EvaluationRun
description: Description
base_url: projects/{{project}}/locations/{{region}}/evaluationRuns
self_link: projects/{{project}}/locations/{{region}}/evaluationRuns/{{name}}
create_url: projects/{{project}}/locations/{{region}}/evaluationRuns
update_mask: true
update_verb: PATCH
error_retry_predicates:
  - transport_tpg.VertexAIEvaluationRunOperationRunningRetry
import_format:
  - projects/{{project}}/locations/{{region}}/evaluationRuns/{{name}}
async:
  type: OpAsync
  operation:
    base_url: projects/{{project}}/locations/{{region}}/evaluationRuns
  actions:
    - delete
  result:
    resource_inside_response: true
autogen_status: RXZhbHVhdGlvblJ1bkF1dG9nZW5WMkFnZW50
samples:
  - name: vertex_ai_evaluation_run_basic
    primary_resource_id: basic_run
    steps:
      - name: vertex_ai_evaluation_run_basic
  - name: vertex_ai_evaluation_run_full
    primary_resource_id: full_run
    steps:
      - name: vertex_ai_evaluation_run_full
parameters:
  - name: region
    type: String
    description: The region of the evaluation run. eg us-central1
    immutable: true
    url_param_only: true

properties:
  - name: completionTime
    type: String
    description: Time when the evaluation run was completed.
    output: true
  - name: createTime
    type: String
    description: Time when the evaluation run was created.
    output: true
  - name: dataSource
    type: NestedObject
    required: true
    description: The data source for the evaluation run.
    properties:
      - name: bigqueryRequestSet
        type: NestedObject
        description: The request set for the evaluation run.
        properties:
          - name: candidateResponseColumns
            type: KeyValuePairs
            description: |-
              Map of candidate name to candidate response column name.
              The column will be in evaluation_item.CandidateResponse format.
          - name: promptColumn
            type: String
            description: |-
              The name of the column that contains the requests to evaluate.
              This will be in evaluation_item.EvalPrompt format.
          - name: referenceColumn
            type: String
            description: |-
              The name of the column containing the reference response.
              This is in evaluation_item.GoldenResponse format.
          - name: rubricsColumn
            type: String
            description: |-
              The name of the column that contains the rubrics.
              This is in evaluation_rubric.RubricGroup format.
          - name: samplingConfig
            type: NestedObject
            description: The sampling config.
            properties:
              - name: samplingCount
                type: Integer
                description: |-
                  The total number of logged data to import. If available data is less than
                  the sampling count, all data will be imported. Default is 100.
              - name: samplingDuration
                type: String
                description: |-
                  How long to wait before sampling data from the BigQuery table.
                  If not specified, defaults to 0.
              - name: samplingMethod
                type: String
                description: |-
                  The sampling method to use.
                  Possible values:
                  RANDOM
          - name: uri
            type: String
            required: true
            description: |-
              The URI of a BigQuery table.
              e.g. bq://projectId.bqDatasetId.bqTableId
      - name: evaluationSet
        type: String
        diff_suppress_func: tpgresource.ProjectNumberDiffSuppress
        description: |-
          The EvaluationSet resource name.
          Format:
          `projects/{project}/locations/{location}/evaluationSets/{evaluation_set}`
  - name: displayName
    type: String
    required: true
    description: The display name of the Evaluation Run.
  - name: error
    type: NestedObject
    output: true
    description: |-
      The `Status` type defines a logical error model that is suitable for
      different programming environments, including REST APIs and RPC APIs. It is
      used by [gRPC](https://github.com/grpc). Each `Status` message contains
      three pieces of data: error code, error message, and error details.

      You can find out more about this error model and how to work with it in the
      [API Design Guide](https://cloud.google.com/apis/design/errors).
    properties:
      - name: code
        type: Integer
        description: The status code, which should be an enum value of google.rpc.Code.
      - name: details
        type: Array
        description: |-
          A list of messages that carry the error details.  There is a common set of
          message types for APIs to use.
        item_type:
          type: NestedObject
          properties: []
      - name: message
        type: String
        description: |-
          A developer-facing error message, which should be in English. Any
          user-facing error message should be localized and sent in the
          google.rpc.Status.details field, or localized by the client.
  - name: evaluationConfig
    type: NestedObject
    description: The Evalution configuration used for the evaluation run.
    properties:
      - name: autoraterConfig
        type: NestedObject
        description: The autorater config used for the evaluation run.
        properties:
          - name: autoraterModel
            type: String
            description: |-
              The fully qualified name of the publisher model or tuned autorater
              endpoint to use.

              Publisher model format:
              `projects/{project}/locations/{location}/publishers/*/models/*`

              Tuned model endpoint format:
              `projects/{project}/locations/{location}/endpoints/{endpoint}`
          - name: generationConfig
            type: NestedObject
            description: |-
              Configuration for content generation.

              This message contains all the parameters that control how the model generates
              content. It allows you to influence the randomness, length, and structure of
              the output.
            properties:
              - name: audioTimestamp
                type: Boolean
                description: |-
                  If enabled, audio timestamps will be included in the request to
                  the model. This can be useful for synchronizing audio with other modalities
                  in the response.
              - name: candidateCount
                type: Integer
                description: |-
                  The number of candidate responses to generate.

                  A higher `candidate_count` can provide more options to choose from, but it
                  also consumes more resources. This can be useful for generating a variety
                  of responses and selecting the best one.
              - name: contextConfig
                type: NestedObject
                description: |-
                  Config related to the context window for the generation request.
                  This may include configurations such as:
                  * Whether we apply sliding window to the historical context,
                  and what is the expected window size.
                  * Whether we include video frames all the time, or only when there is a
                  sentence detected from the audio.
                properties:
                  - name: videoFrameOnlyDuringAudioActivity
                    type: Boolean
                    description: |-
                      If true, video frames will only be included when there is a sentence
                      detected from the audio.
              - name: echo
                type: Boolean
                description: Echo.
              - name: enableAffectiveDialog
                type: Boolean
                description: |-
                  If enabled, the model will detect emotions and adapt its
                  responses accordingly. For example, if the model detects that the user is
                  frustrated, it may provide a more empathetic response.
              - name: frequencyPenalty
                type: Double
                description: |-
                  Penalizes tokens based on their frequency in the generated text.
                  A positive value helps to reduce the repetition of words and phrases.
                  Valid values can range from [-2.0, 2.0].
              - name: imageConfig
                type: NestedObject
                description: |-
                  Configuration for image generation.

                  This message allows you to control various aspects of image generation, such
                  as the output format, aspect ratio, and whether the model can generate
                  images of people.
                properties:
                  - name: aspectRatio
                    type: String
                    description: |-
                      The desired aspect ratio for the generated images. The following
                      aspect ratios are supported:

                      "1:1"
                      "2:3", "3:2"
                      "3:4", "4:3"
                      "4:5", "5:4"
                      "9:16", "16:9"
                      "21:9"
                  - name: imageOutputOptions
                    type: NestedObject
                    description: The image output format for generated images.
                    properties:
                      - name: compressionQuality
                        type: Integer
                        description: The compression quality of the output image.
                      - name: mimeType
                        type: String
                        description: The image format that the output should be saved as.
                  - name: imageSize
                    type: String
                    description: |-
                      Specifies the size of generated images. Supported values are `1K`, `2K`,
                      `4K`. If not specified, the model will use default value `1K`.
                  - name: personGeneration
                    type: String
                    description: |-
                      Controls whether the model can generate people.
                      Possible values:
                      ALLOW_ALL
                      ALLOW_ADULT
                      ALLOW_NONE
                  - name: prominentPeople
                    type: String
                    description: |-
                      Controls whether prominent people (celebrities) generation is allowed. If
                      used with personGeneration, personGeneration enum would take precedence.
                      For instance, if ALLOW_NONE is set, all person generation would be blocked.
                      If this field is unspecified, the default behavior is to allow prominent
                      people.
                      Possible values:
                      ALLOW_PROMINENT_PEOPLE
                      BLOCK_PROMINENT_PEOPLE
              - name: logitBias
                type: KeyValuePairs
                description: |-
                  A map that allows you to adjust the probability of specific
                  tokens being generated. Each key is a token (as a string), and the
                  value is a bias (a float). A positive bias increases the likelihood
                  of the token appearing in the output, while a negative bias
                  decreases it. This can be used to guide the model's output and
                  prevent it from generating certain words.
              - name: logprobs
                type: Integer
                description: |-
                  The number of top log probabilities to return for each token.

                  This can be used to see which other tokens were considered likely
                  candidates for a given position. A higher value will return more options,
                  but it will also increase the size of the response.
              - name: maxOutputTokens
                type: Integer
                description: |-
                  The maximum number of tokens to generate in the response.

                  A token is approximately four characters. The default value varies by
                  model. This parameter can be used to control the length of the generated
                  text and prevent overly long responses.
              - name: mediaResolution
                type: String
                description: |-
                  The token resolution at which input media content is sampled. This is
                  used to control the trade-off between the quality of the response and the
                  number of tokens used to represent the media. A higher resolution allows
                  the model to perceive more detail, which can lead to a more nuanced
                  response, but it will also use more tokens. This does not affect the
                  image dimensions sent to the model.
                  Possible values:
                  MEDIA_RESOLUTION_LOW
                  MEDIA_RESOLUTION_MEDIUM
                  MEDIA_RESOLUTION_HIGH
              - name: minP
                type: Double
                description: If specified, min-p sampling will be used.
              - name: presencePenalty
                type: Double
                description: |-
                  Penalizes tokens that have already appeared in the generated
                  text. A positive value encourages the model to generate more diverse and
                  less repetitive text. Valid values can range from [-2.0, 2.0].
              - name: requestLogprobs
                type: Boolean
                description: When set to true, return logprobs for the request itself.
              - name: requestLogprobsConfig
                type: NestedObject
                description: Configuration to control request logprobs.
                properties:
                  - name: skipBos
                    type: Boolean
                    description: |-
                      When set to true, skip prepending '' at the beginning of the input
                      prompt.
                  - name: skipEos
                    type: Boolean
                    description: When set to true, skip appending '' to the end of the input prompt.
              - name: requestTopKLogprobs
                type: Integer
                description: Return top-k logprobs for the input request.
              - name: responseJsonSchema
                type: NestedObject
                description: |-
                  When this field is set,
                  response_schema
                  must be omitted and
                  response_mime_type
                  must be set to `application/json`.
                properties: []
              - name: responseLogprobs
                type: Boolean
                description: |-
                  If set to true, the log probabilities of the output tokens are
                  returned.

                  Log probabilities are the logarithm of the probability of a token appearing
                  in the output. A higher log probability means the token is more likely to
                  be generated. This can be useful for analyzing the model's confidence in
                  its own output and for debugging.
              - name: responseMimeType
                type: String
                description: |-
                  The IANA standard MIME type of the response. The model will
                  generate output that conforms to this MIME type. Supported values include
                  'text/plain' (default) and 'application/json'. The model needs to be
                  prompted to output the appropriate response type, otherwise the behavior is
                  undefined.
              - name: responseModalities
                type: Array
                description: |-
                  The modalities of the response. The model will generate a
                  response that includes all the specified modalities. For example, if this
                  is set to `[TEXT, IMAGE]`, the response will include both text and an
                  image.
                item_type:
                  type: String
              - name: responseRegexConstraint
                type: String
                description: |-
                  Regex constraint for the generated response.

                  If set, `response_schema` or `response_json_schema` must be omitted.
              - name: responseSchema
                type: NestedObject
                description: Defines the schema of input and output data.
                properties:
                  - name: description
                    type: String
                    description: No description
                  - name: format
                    type: String
                    description: No description
                  - name: type
                    type: String
                    description: No description
              - name: routingConfig
                type: NestedObject
                description: |-
                  The configuration for routing the request to a specific model.
                  This can be used to control which model is used for the generation, either
                  automatically or by specifying a model name.
                properties:
                  - name: autoMode
                    type: NestedObject
                    description: |-
                      The configuration for automated routing.

                      When automated routing is specified, the routing will be determined by
                      the pretrained routing model and customer provided model routing
                      preference.
                    properties:
                      - name: modelRoutingPreference
                        type: String
                        description: |-
                          The model routing preference.
                          Possible values:
                          UNKNOWN
                          PRIORITIZE_QUALITY
                          BALANCED
                          PRIORITIZE_COST
                  - name: manualMode
                    type: NestedObject
                    description: |-
                      The configuration for manual routing.

                      When manual routing is specified, the model will be selected based on the
                      model name provided.
                    properties:
                      - name: modelName
                        type: String
                        description: The name of the model to use. Only public LLM models are accepted.
              - name: seed
                type: Integer
                description: |-
                  A seed for the random number generator.

                  By setting a seed, you can make the model's output mostly deterministic.
                  For a given prompt and parameters (like temperature, top_p, etc.), the
                  model will produce the same response every time. However, it's not a
                  guaranteed absolute deterministic behavior. This is different from
                  parameters like `temperature`, which control the *level* of randomness.
                  `seed` ensures that the "random" choices the model makes are the same on
                  every run, making it essential for testing and ensuring reproducible
                  results.
              - name: speechConfig
                type: NestedObject
                description: Configuration for speech generation.
                properties:
                  - name: languageCode
                    type: String
                    description: The language code (ISO 639-1) for the speech synthesis.
                  - name: multiSpeakerVoiceConfig
                    type: NestedObject
                    description: Configuration for a multi-speaker text-to-speech request.
                    properties:
                      - name: speakerVoiceConfigs
                        type: Array
                        required: true
                        description: |-
                          A list of configurations for the voices of the speakers. Exactly
                          two speaker voice configurations must be provided.
                        item_type:
                          type: NestedObject
                          properties:
                            - name: speaker
                              type: String
                              required: true
                              description: |-
                                The name of the speaker. This should be the same as the speaker
                                name used in the prompt.
                            - name: voiceConfig
                              type: NestedObject
                              required: true
                              description: Configuration for a voice.
                              properties:
                                - name: customVoiceConfig
                                  type: NestedObject
                                  description: Configuration for a custom voice.
                                  properties:
                                    - name: customVoiceSample
                                      type: String
                                      description: The audio sample of the custom voice, in PCM16/s16le format.
                                - name: prebuiltVoiceConfig
                                  type: NestedObject
                                  description: Configuration for a prebuilt voice.
                                  properties:
                                    - name: voiceName
                                      type: String
                                      description: The name of the prebuilt voice to use.
                                - name: replicatedVoiceConfig
                                  type: NestedObject
                                  description: The configuration for the replicated voice to use.
                                  properties:
                                    - name: consentAudio
                                      type: String
                                      description: |-
                                        Input only. The recorded consent verifying ownership of the voice. This represents
                                        16-bit signed little-endian wav data, with a 24kHz sampling rate.
                                    - name: mimeType
                                      type: String
                                      description: |-
                                        The mimetype of the voice sample. The only currently supported value is
                                        `audio/wav`.
                                        This represents 16-bit signed little-endian wav data, with a 24kHz
                                        sampling rate.
                                        `mime_type` will default to `audio/wav` if not set.
                                    - name: voiceSampleAudio
                                      type: String
                                      description: The sample of the custom voice.
                  - name: voiceConfig
                    type: NestedObject
                    description: Configuration for a voice.
                    properties:
                      - name: customVoiceConfig
                        type: NestedObject
                        description: Configuration for a custom voice.
                        properties:
                          - name: customVoiceSample
                            type: String
                            description: The audio sample of the custom voice, in PCM16/s16le format.
                      - name: prebuiltVoiceConfig
                        type: NestedObject
                        description: Configuration for a prebuilt voice.
                        properties:
                          - name: voiceName
                            type: String
                            description: The name of the prebuilt voice to use.
                      - name: replicatedVoiceConfig
                        type: NestedObject
                        description: The configuration for the replicated voice to use.
                        properties:
                          - name: consentAudio
                            type: String
                            description: |-
                              Input only. The recorded consent verifying ownership of the voice. This represents
                              16-bit signed little-endian wav data, with a 24kHz sampling rate.
                          - name: mimeType
                            type: String
                            description: |-
                              The mimetype of the voice sample. The only currently supported value is
                              `audio/wav`.
                              This represents 16-bit signed little-endian wav data, with a 24kHz
                              sampling rate.
                              `mime_type` will default to `audio/wav` if not set.
                          - name: voiceSampleAudio
                            type: String
                            description: The sample of the custom voice.
              - name: stopSequences
                type: Array
                description: |-
                  A list of character sequences that will stop the model from
                  generating further tokens. If a stop sequence is generated, the output
                  will end at that point. This is useful for controlling the length and
                  structure of the output. For example, you can use ["\n", "###"] to stop
                  generation at a new line or a specific marker.
                item_type:
                  type: String
              - name: temperature
                type: Double
                description: |-
                  Controls the randomness of the output. A higher temperature
                  results in more creative and diverse responses, while a lower temperature
                  makes the output more predictable and focused. The valid range is (0.0,
                  2.0].
              - name: thinkingConfig
                type: NestedObject
                description: |-
                  Configuration for the model's thinking features.

                  "Thinking" is a process where the model breaks down a complex task into
                  smaller, manageable steps. This allows the model to reason about the task,
                  plan its approach, and execute the plan to generate a high-quality
                  response.
                properties:
                  - name: includeThoughts
                    type: Boolean
                    description: |-
                      If true, the model will include its thoughts in the response. "Thoughts"
                      are the intermediate steps the model takes to arrive at the final
                      response. They can provide insights into the model's reasoning process
                      and help with debugging. If this is true, thoughts are returned only when
                      available.
                  - name: thinkingBudget
                    type: Integer
                    description: |-
                      The token budget for the model's thinking process. The model will make a
                      best effort to stay within this budget. This can be used to control the
                      trade-off between response quality and latency.
                  - name: thinkingLevel
                    type: String
                    description: |-
                      The number of thoughts tokens that the model should generate.
                      Possible values:
                      LOW
                      MEDIUM
                      HIGH
                      MINIMAL
              - name: topK
                type: Double
                description: |-
                  Specifies the top-k sampling threshold. The model considers only
                  the top k most probable tokens for the next token. This can be useful for
                  generating more coherent and less random text. For example, a `top_k` of 40
                  means the model will choose the next word from the 40 most likely words.
              - name: topP
                type: Double
                description: |-
                  Specifies the nucleus sampling threshold. The model considers
                  only the smallest set of tokens whose cumulative probability is at least
                  `top_p`. This helps generate more diverse and less repetitive responses.
                  For example, a `top_p` of 0.9 means the model considers tokens until the
                  cumulative probability of the tokens to select from reaches 0.9. It's
                  recommended to adjust either temperature or `top_p`, but not both.
          - name: sampleCount
            type: Integer
            description: |-
              Number of samples for each instance in the dataset.
              If not specified, the default is 4. Minimum value is 1, maximum value
              is 32.
      - name: datasetCustomMetrics
        type: Array
        description: Specifications for custom dataset-level aggregations.
        item_type:
          type: NestedObject
          properties:
            - name: aggregationFunction
              type: String
              required: true
              description: |-
                The Python code string containing the aggregation function.
                Expected function signature:
                `def aggregate(instances: list[dict[str, Any]]) -> dict[str, float]:`

                The `instances` argument is a list of dictionaries, where each dictionary
                represents a single evaluation result item. The structure of each
                dictionary corresponds to the fields in the `EvaluationResult` message.

                This includes:
                - `"request"`: Contains the original input data and model inputs
                (from `EvaluationResult.EvaluationRequest`).
                - `"candidate_results"`: Contains the results of any instance-level
                metrics (from `EvaluationResult.CandidateResults`).

                Example of a single item in the `instances` list:
                {
                "request": {
                "prompt": {"text": "What is the capital of France?"},
                "golden_response": {"text": "Paris"},
                "candidate_responses": [{"candidate": "model-v1", "text": "Paris"}]
                },
                "candidate_results": [
                {"metric": "exact_match", "score": 1.0},
                {"metric": "bleu", "score": 0.9}
                ]
                }
            - name: displayName
              type: String
              description: |-
                A display name for this custom summary metric. Used to prefix
                keys in the output summaryMetrics map.
                If not provided, a default name like "dataset_custom_metric_1",
                "dataset_custom_metric_2", etc., will be generated based on the
                order in the repeated field.
      - name: metrics
        type: Array
        description: |-
          The metrics to be calculated in the evaluation run.
          Required when analysis_configs is not set.
        item_type:
          type: NestedObject
          properties:
            - name: computationBasedMetricSpec
              type: NestedObject
              description: Specification for a computation based metric.
              properties:
                - name: parameters
                  type: KeyValuePairs
                  description: 'A map of parameters for the metric, e.g. {"rouge_type": "rougeL"}.'
                - name: type
                  type: String
                  required: true
                  description: |-
                    The type of the computation based metric.
                    Possible values:
                    EXACT_MATCH
                    BLEU
                    ROUGE
            - name: inputMapping
              type: KeyValuePairs
              description: |-
                Maps the input name expected by the metric (key) to the prompt template
                variable name (value) from the dataset.
                Example: {"context": "additional_context", "reference": "ground_truth_col"}
                The max number of mapped inputs is 50.
            - name: llmBasedMetricSpec
              type: NestedObject
              description: Specification for an LLM based metric.
              properties:
                - name: additionalConfig
                  type: KeyValuePairs
                  description: Optional additional configuration for the metric.
                - name: judgeAutoraterConfig
                  type: NestedObject
                  description: The autorater config used for the evaluation run.
                  properties:
                    - name: autoraterModel
                      type: String
                      description: |-
                        The fully qualified name of the publisher model or tuned autorater
                        endpoint to use.

                        Publisher model format:
                        `projects/{project}/locations/{location}/publishers/*/models/*`

                        Tuned model endpoint format:
                        `projects/{project}/locations/{location}/endpoints/{endpoint}`
                    - name: generationConfig
                      type: NestedObject
                      description: |-
                        Configuration for content generation.

                        This message contains all the parameters that control how the model generates
                        content. It allows you to influence the randomness, length, and structure of
                        the output.
                      properties:
                        - name: audioTimestamp
                          type: Boolean
                          description: |-
                            If enabled, audio timestamps will be included in the request to
                            the model. This can be useful for synchronizing audio with other modalities
                            in the response.
                        - name: candidateCount
                          type: Integer
                          description: |-
                            The number of candidate responses to generate.

                            A higher `candidate_count` can provide more options to choose from, but it
                            also consumes more resources. This can be useful for generating a variety
                            of responses and selecting the best one.
                        - name: contextConfig
                          type: NestedObject
                          description: |-
                            Config related to the context window for the generation request.
                            This may include configurations such as:
                            * Whether we apply sliding window to the historical context,
                            and what is the expected window size.
                            * Whether we include video frames all the time, or only when there is a
                            sentence detected from the audio.
                          properties:
                            - name: videoFrameOnlyDuringAudioActivity
                              type: Boolean
                              description: |-
                                If true, video frames will only be included when there is a sentence
                                detected from the audio.
                        - name: echo
                          type: Boolean
                          description: Echo.
                        - name: enableAffectiveDialog
                          type: Boolean
                          description: |-
                            If enabled, the model will detect emotions and adapt its
                            responses accordingly. For example, if the model detects that the user is
                            frustrated, it may provide a more empathetic response.
                        - name: frequencyPenalty
                          type: Double
                          description: |-
                            Penalizes tokens based on their frequency in the generated text.
                            A positive value helps to reduce the repetition of words and phrases.
                            Valid values can range from [-2.0, 2.0].
                        - name: imageConfig
                          type: NestedObject
                          description: |-
                            Configuration for image generation.

                            This message allows you to control various aspects of image generation, such
                            as the output format, aspect ratio, and whether the model can generate
                            images of people.
                          properties:
                            - name: aspectRatio
                              type: String
                              description: |-
                                The desired aspect ratio for the generated images. The following
                                aspect ratios are supported:

                                "1:1"
                                "2:3", "3:2"
                                "3:4", "4:3"
                                "4:5", "5:4"
