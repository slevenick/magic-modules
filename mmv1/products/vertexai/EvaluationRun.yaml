                  '/', a '/' will be automatically appended. The directory is created if it
                  doesn't exist.
      - name: promptTemplate
        type: NestedObject
        description: Prompt template used for inference.
        properties:
          - name: gcsUri
            type: String
            description: |-
              Prompt template stored in Cloud Storage. Format:
              "gs://my-bucket/file-name.txt".
          - name: promptTemplate
            type: String
            description: |-
              Inline prompt template. Template variables should be in the format
              "{var_name}". Example:
              "Translate the following from {source_lang} to {target_lang}:
              {text}"
