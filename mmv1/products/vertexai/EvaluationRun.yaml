                      description: The spec for a pre-defined metric.
                      properties:
                        - name: metricSpecName
                          type: String
                          required: true
                          description: |-
                            The name of a pre-defined metric, such as "instruction_following_v1" or
                            "text_quality_v1".
                        - name: metricSpecParameters
                          type: KeyValuePairs
                          description: The parameters needed to run the pre-defined metric.
                    - name: resultParserConfig
                      type: NestedObject
                      description: |-
                        Config for parsing LLM responses.
                        It can be used to parse the LLM response to be evaluated, or the LLM
                        response from LLM-based metrics/Autoraters.
                      properties:
                        - name: customCodeParserConfig
                          type: NestedObject
                          description: Configuration for parsing the LLM response using custom code.
                          properties:
                            - name: parsingFunction
                              type: String
                              required: true
                              description: |-
                                Python function for parsing results. The function should be defined
                                within this string.

                                The function takes a list of strings (LLM responses) and should return
                                either a list of dictionaries (for rubrics) or a single dictionary
                                (for a metric result).

                                Example function signature:
                                def parse(responses: list[str]) -> list[dict[str, Any]] | dict[str, Any]:

                                When parsing rubrics, return a list of dictionaries, where each
                                dictionary represents a Rubric.
                                Example for rubrics:
                                [
                                {
                                "content": {"property": {"description": "The response is
                                factual."}},
                                "type": "FACTUALITY",
                                "importance": "HIGH"
                                },
                                {
                                "content": {"property": {"description": "The response is
                                fluent."}},
                                "type": "FLUENCY",
                                "importance": "MEDIUM"
                                }
                                ]

                                When parsing critique results, return a dictionary representing a
                                MetricResult.
                                Example for a metric result:
                                {
                                "score": 0.8,
                                "explanation": "The model followed most instructions.",
                                "rubric_verdicts": [...]
                                }

                                ... code for result extraction and aggregation
                        - name: jsonParserConfig
                          type: NestedObject
                          description: Configuration for parsing the LLM response using JSON.
                          properties:
                            - name: jsonKeys
                              type: NestedObject
                              description: Repeated json keys.
                              properties:
                                - name: keys
                                  type: Array
                                  required: true
                                  description: Keys to extract from JSON.
                                  item_type:
                                    type: String
                            - name: schema
                              type: String
                              description: The JSON schema to use for validation.
                        - name: regexParserConfig
                          type: NestedObject
                          description: Config for parsing LLM responses using a regular expression.
                          properties:
                            - name: regexPattern
                              type: String
                              description: |-
                                A regular expression to extract data.
                                For example, if the LLM response is:
                                "The answer is 42."
                                and you want to extract the value `42`, you can define the following
                                regex parser config:
                                ```
                                regex_pattern: ".*(.*).*"
                                ```
                                This will extract `42` and return it as the parsed result.
                        - name: xmlParserConfig
                          type: NestedObject
                          description: Configuration for parsing the LLM response using XML.
                          properties:
                            - name: schema
                              type: String
                              description: The XML schema to use for validation.
                            - name: xmlKeys
                              type: NestedObject
                              description: Repeated xml keys.
                              properties:
                                - name: keys
                                  type: Array
                                  required: true
                                  description: Keys to extract from XML.
                                  item_type:
                                    type: String
                    - name: rubricGenerationSpec
                      type: NestedObject
                      description: Specification for how rubrics should be generated.
                      properties:
                        - name: modelConfig
                          type: NestedObject
                          description: |-
                            The configs for autorater. This is applicable to both EvaluateInstances and
                            EvaluateDataset.
                          properties:
                            - name: autoraterModel
                              type: String
                              description: |-
                                The fully qualified name of the publisher model or tuned autorater
                                endpoint to use.

                                Publisher model format:
                                `projects/{project}/locations/{location}/publishers/*/models/*`

                                Tuned model endpoint format:
                                `projects/{project}/locations/{location}/endpoints/{endpoint}`
                            - name: flipEnabled
                              type: Boolean
                              description: |-
                                Default is true. Whether to flip the candidate and baseline
                                responses. This is only applicable to the pairwise metric. If enabled, also
                                provide PairwiseMetricSpec.candidate_response_field_name and
                                PairwiseMetricSpec.baseline_response_field_name. When rendering
                                PairwiseMetricSpec.metric_prompt_template, the candidate and baseline
                                fields will be flipped for half of the samples to reduce bias.
                            - name: generationConfig
                              type: NestedObject
                              description: |-
                                Configuration for content generation.

                                This message contains all the parameters that control how the model generates
                                content. It allows you to influence the randomness, length, and structure of
                                the output.
                              properties:
                                - name: audioTimestamp
                                  type: Boolean
                                  description: |-
                                    If enabled, audio timestamps will be included in the request to
                                    the model. This can be useful for synchronizing audio with other modalities
                                    in the response.
                                - name: candidateCount
                                  type: Integer
                                  description: |-
                                    The number of candidate responses to generate.

                                    A higher `candidate_count` can provide more options to choose from, but it
                                    also consumes more resources. This can be useful for generating a variety
                                    of responses and selecting the best one.
                                - name: contextConfig
                                  type: NestedObject
                                  description: |-
                                    Config related to the context window for the generation request.
                                    This may include configurations such as:
                                    * Whether we apply sliding window to the historical context,
                                    and what is the expected window size.
                                    * Whether we include video frames all the time, or only when there is a
                                    sentence detected from the audio.
                                  properties:
                                    - name: videoFrameOnlyDuringAudioActivity
                                      type: Boolean
                                      description: |-
                                        If true, video frames will only be included when there is a sentence
                                        detected from the audio.
                                - name: echo
                                  type: Boolean
                                  description: Echo.
                                - name: enableAffectiveDialog
                                  type: Boolean
                                  description: |-
                                    If enabled, the model will detect emotions and adapt its
                                    responses accordingly. For example, if the model detects that the user is
                                    frustrated, it may provide a more empathetic response.
                                - name: frequencyPenalty
                                  type: Double
                                  description: |-
                                    Penalizes tokens based on their frequency in the generated text.
                                    A positive value helps to reduce the repetition of words and phrases.
                                    Valid values can range from [-2.0, 2.0].
                                - name: imageConfig
                                  type: NestedObject
                                  description: |-
                                    Configuration for image generation.

                                    This message allows you to control various aspects of image generation, such
                                    as the output format, aspect ratio, and whether the model can generate
                                    images of people.
                                  properties:
                                    - name: aspectRatio
                                      type: String
                                      description: |-
                                        The desired aspect ratio for the generated images. The following
                                        aspect ratios are supported:

                                        "1:1"
                                        "2:3", "3:2"
                                        "3:4", "4:3"
                                        "4:5", "5:4"
                                        "9:16", "16:9"
                                        "21:9"
                                    - name: imageOutputOptions
                                      type: NestedObject
                                      description: The image output format for generated images.
                                      properties:
                                        - name: compressionQuality
                                          type: Integer
                                          description: The compression quality of the output image.
                                        - name: mimeType
                                          type: String
                                          description: The image format that the output should be saved as.
                                    - name: imageSize
                                      type: String
                                      description: |-
                                        Specifies the size of generated images. Supported values are `1K`, `2K`,
                                        `4K`. If not specified, the model will use default value `1K`.
                                    - name: personGeneration
                                      type: String
                                      description: |-
                                        Controls whether the model can generate people.
                                        Possible values:
                                        ALLOW_ALL
                                        ALLOW_ADULT
                                        ALLOW_NONE
                                    - name: prominentPeople
                                      type: String
                                      description: |-
                                        Controls whether prominent people (celebrities) generation is allowed. If
                                        used with personGeneration, personGeneration enum would take precedence.
                                        For instance, if ALLOW_NONE is set, all person generation would be blocked.
                                        If this field is unspecified, the default behavior is to allow prominent
                                        people.
                                        Possible values:
                                        ALLOW_PROMINENT_PEOPLE
                                        BLOCK_PROMINENT_PEOPLE
                                - name: logitBias
                                  type: KeyValuePairs
                                  description: |-
                                    A map that allows you to adjust the probability of specific
                                    tokens being generated. Each key is a token (as a string), and the
                                    value is a bias (a float). A positive bias increases the likelihood
                                    of the token appearing in the output, while a negative bias
                                    decreases it. This can be used to guide the model's output and
                                    prevent it from generating certain words.
                                - name: logprobs
                                  type: Integer
                                  description: |-
                                    The number of top log probabilities to return for each token.

                                    This can be used to see which other tokens were considered likely
                                    candidates for a given position. A higher value will return more options,
                                    but it will also increase the size of the response.
                                - name: maxOutputTokens
                                  type: Integer
                                  description: |-
                                    The maximum number of tokens to generate in the response.

                                    A token is approximately four characters. The default value varies by
                                    model. This parameter can be used to control the length of the generated
                                    text and prevent overly long responses.
                                - name: mediaResolution
                                  type: String
                                  description: |-
                                    The token resolution at which input media content is sampled. This is
                                    used to control the trade-off between the quality of the response and the
                                    number of tokens used to represent the media. A higher resolution allows
                                    the model to perceive more detail, which can lead to a more nuanced
                                    response, but it will also use more tokens. This does not affect the
                                    image dimensions sent to the model.
                                    Possible values:
                                    MEDIA_RESOLUTION_LOW
                                    MEDIA_RESOLUTION_MEDIUM
                                    MEDIA_RESOLUTION_HIGH
                                - name: minP
                                  type: Double
                                  description: If specified, min-p sampling will be used.
                                - name: presencePenalty
                                  type: Double
                                  description: |-
                                    Penalizes tokens that have already appeared in the generated
                                    text. A positive value encourages the model to generate more diverse and
                                    less repetitive text. Valid values can range from [-2.0, 2.0].
                                - name: requestLogprobs
                                  type: Boolean
                                  description: When set to true, return logprobs for the request itself.
                                - name: requestLogprobsConfig
                                  type: NestedObject
                                  description: Configuration to control request logprobs.
                                  properties:
                                    - name: skipBos
                                      type: Boolean
                                      description: |-
                                        When set to true, skip prepending '' at the beginning of the input
                                        prompt.
                                    - name: skipEos
                                      type: Boolean
                                      description: When set to true, skip appending '' to the end of the input prompt.
                                - name: requestTopKLogprobs
                                  type: Integer
                                  description: Return top-k logprobs for the input request.
                                - name: responseJsonSchema
                                  type: NestedObject
                                  description: |-
                                    When this field is set,
                                    response_schema
                                    must be omitted and
                                    response_mime_type
                                    must be set to `application/json`.
                                  properties: []
                                - name: responseLogprobs
                                  type: Boolean
                                  description: |-
                                    If set to true, the log probabilities of the output tokens are
                                    returned.

                                    Log probabilities are the logarithm of the probability of a token appearing
                                    in the output. A higher log probability means the token is more likely to
                                    be generated. This can be useful for analyzing the model's confidence in
                                    its own output and for debugging.
                                - name: responseMimeType
                                  type: String
                                  description: |-
                                    The IANA standard MIME type of the response. The model will
                                    generate output that conforms to this MIME type. Supported values include
                                    'text/plain' (default) and 'application/json'. The model needs to be
                                    prompted to output the appropriate response type, otherwise the behavior is
                                    undefined.
                                - name: responseModalities
                                  type: Array
                                  description: |-
                                    The modalities of the response. The model will generate a
                                    response that includes all the specified modalities. For example, if this
                                    is set to `[TEXT, IMAGE]`, the response will include both text and an
                                    image.
                                  item_type:
                                    type: String
                                - name: responseRegexConstraint
                                  type: String
                                  description: |-
                                    Regex constraint for the generated response.

                                    If set, `response_schema` or `response_json_schema` must be omitted.
                                - name: responseSchema
                                  type: NestedObject
                                  description: Defines the schema of input and output data.
                                  properties:
                                    - name: description
                                      type: String
                                      description: No description
                                    - name: format
                                      type: String
                                      description: No description
                                    - name: type
                                      type: String
                                      description: No description
                                - name: routingConfig
                                  type: NestedObject
                                  description: |-
                                    The configuration for routing the request to a specific model.
                                    This can be used to control which model is used for the generation, either
                                    automatically or by specifying a model name.
                                  properties:
                                    - name: autoMode
                                      type: NestedObject
                                      description: |-
                                        The configuration for automated routing.

                                        When automated routing is specified, the routing will be determined by
                                        the pretrained routing model and customer provided model routing
                                        preference.
                                      properties:
                                        - name: modelRoutingPreference
                                          type: String
                                          description: |-
                                            The model routing preference.
                                            Possible values:
                                            UNKNOWN
                                            PRIORITIZE_QUALITY
                                            BALANCED
                                            PRIORITIZE_COST
                                    - name: manualMode
                                      type: NestedObject
                                      description: |-
                                        The configuration for manual routing.

                                        When manual routing is specified, the model will be selected based on the
                                        model name provided.
                                      properties:
                                        - name: modelName
                                          type: String
                                          description: The name of the model to use. Only public LLM models are accepted.
                                - name: seed
                                  type: Integer
                                  description: |-
                                    A seed for the random number generator.

                                    By setting a seed, you can make the model's output mostly deterministic.
                                    For a given prompt and parameters (like temperature, top_p, etc.), the
                                    model will produce the same response every time. However, it's not a
                                    guaranteed absolute deterministic behavior. This is different from
                                    parameters like `temperature`, which control the *level* of randomness.
                                    `seed` ensures that the "random" choices the model makes are the same on
                                    every run, making it essential for testing and ensuring reproducible
                                    results.
                                - name: speechConfig
                                  type: NestedObject
                                  description: Configuration for speech generation.
                                  properties:
                                    - name: languageCode
                                      type: String
                                      description: The language code (ISO 639-1) for the speech synthesis.
                                    - name: multiSpeakerVoiceConfig
                                      type: NestedObject
                                      description: Configuration for a multi-speaker text-to-speech request.
                                      properties:
                                        - name: speakerVoiceConfigs
                                          type: Array
                                          required: true
                                          description: |-
                                            A list of configurations for the voices of the speakers. Exactly
                                            two speaker voice configurations must be provided.
                                          item_type:
                                            type: NestedObject
                                            properties:
                                              - name: speaker
                                                type: String
                                                required: true
                                                description: |-
                                                  The name of the speaker. This should be the same as the speaker
                                                  name used in the prompt.
                                              - name: voiceConfig
                                                type: NestedObject
                                                required: true
                                                description: Configuration for a voice.
                                                properties:
                                                  - name: customVoiceConfig
                                                    type: NestedObject
                                                    description: Configuration for a custom voice.
                                                    properties:
                                                      - name: customVoiceSample
                                                        type: String
                                                        description: The audio sample of the custom voice, in PCM16/s16le format.
                                                  - name: prebuiltVoiceConfig
                                                    type: NestedObject
                                                    description: Configuration for a prebuilt voice.
                                                    properties:
                                                      - name: voiceName
                                                        type: String
                                                        description: The name of the prebuilt voice to use.
                                                  - name: replicatedVoiceConfig
                                                    type: NestedObject
                                                    description: The configuration for the replicated voice to use.
                                                    properties:
                                                      - name: consentAudio
                                                        type: String
                                                        description: |-
                                                          Input only. The recorded consent verifying ownership of the voice. This represents
                                                          16-bit signed little-endian wav data, with a 24kHz sampling rate.
                                                      - name: mimeType
                                                        type: String
                                                        description: |-
                                                          The mimetype of the voice sample. The only currently supported value is
                                                          `audio/wav`.
                                                          This represents 16-bit signed little-endian wav data, with a 24kHz
                                                          sampling rate.
                                                          `mime_type` will default to `audio/wav` if not set.
                                                      - name: voiceSampleAudio
                                                        type: String
                                                        description: The sample of the custom voice.
                                    - name: voiceConfig
                                      type: NestedObject
                                      description: Configuration for a voice.
                                      properties:
                                        - name: customVoiceConfig
                                          type: NestedObject
                                          description: Configuration for a custom voice.
                                          properties:
                                            - name: customVoiceSample
                                              type: String
                                              description: The audio sample of the custom voice, in PCM16/s16le format.
                                        - name: prebuiltVoiceConfig
                                          type: NestedObject
                                          description: Configuration for a prebuilt voice.
                                          properties:
                                            - name: voiceName
                                              type: String
                                              description: The name of the prebuilt voice to use.
                                        - name: replicatedVoiceConfig
                                          type: NestedObject
                                          description: The configuration for the replicated voice to use.
                                          properties:
                                            - name: consentAudio
                                              type: String
                                              description: |-
                                                Input only. The recorded consent verifying ownership of the voice. This represents
                                                16-bit signed little-endian wav data, with a 24kHz sampling rate.
                                            - name: mimeType
                                              type: String
                                              description: |-
                                                The mimetype of the voice sample. The only currently supported value is
                                                `audio/wav`.
                                                This represents 16-bit signed little-endian wav data, with a 24kHz
                                                sampling rate.
                                                `mime_type` will default to `audio/wav` if not set.
                                            - name: voiceSampleAudio
                                              type: String
                                              description: The sample of the custom voice.
                                - name: stopSequences
                                  type: Array
                                  description: |-
                                    A list of character sequences that will stop the model from
                                    generating further tokens. If a stop sequence is generated, the output
                                    will end at that point. This is useful for controlling the length and
                                    structure of the output. For example, you can use ["\n", "###"] to stop
                                    generation at a new line or a specific marker.
                                  item_type:
                                    type: String
                                - name: temperature
                                  type: Double
                                  description: |-
                                    Controls the randomness of the output. A higher temperature
                                    results in more creative and diverse responses, while a lower temperature
                                    makes the output more predictable and focused. The valid range is (0.0,
                                    2.0].
                                - name: thinkingConfig
                                  type: NestedObject
                                  description: |-
                                    Configuration for the model's thinking features.

                                    "Thinking" is a process where the model breaks down a complex task into
                                    smaller, manageable steps. This allows the model to reason about the task,
                                    plan its approach, and execute the plan to generate a high-quality
                                    response.
                                  properties:
                                    - name: includeThoughts
                                      type: Boolean
                                      description: |-
                                        If true, the model will include its thoughts in the response. "Thoughts"
                                        are the intermediate steps the model takes to arrive at the final
                                        response. They can provide insights into the model's reasoning process
                                        and help with debugging. If this is true, thoughts are returned only when
                                        available.
                                    - name: thinkingBudget
                                      type: Integer
                                      description: |-
                                        The token budget for the model's thinking process. The model will make a
                                        best effort to stay within this budget. This can be used to control the
                                        trade-off between response quality and latency.
                                    - name: thinkingLevel
                                      type: String
                                      description: |-
                                        The number of thoughts tokens that the model should generate.
                                        Possible values:
                                        LOW
                                        MEDIUM
                                        HIGH
                                        MINIMAL
                                - name: topK
                                  type: Double
                                  description: |-
                                    Specifies the top-k sampling threshold. The model considers only
                                    the top k most probable tokens for the next token. This can be useful for
                                    generating more coherent and less random text. For example, a `top_k` of 40
                                    means the model will choose the next word from the 40 most likely words.
                                - name: topP
                                  type: Double
                                  description: |-
                                    Specifies the nucleus sampling threshold. The model considers
                                    only the smallest set of tokens whose cumulative probability is at least
                                    `top_p`. This helps generate more diverse and less repetitive responses.
                                    For example, a `top_p` of 0.9 means the model considers tokens until the
                                    cumulative probability of the tokens to select from reaches 0.9. It's
                                    recommended to adjust either temperature or `top_p`, but not both.
                            - name: samplingCount
                              type: Integer
                              description: |-
                                Number of samples for each instance in the dataset.
                                If not specified, the default is 4. Minimum value is 1, maximum value
                                is 32.
                        - name: promptTemplate
                          type: String
                          description: |-
                            Template for the prompt used to generate rubrics.
                            The details should be updated based on the most-recent recipe requirements.
                        - name: rubricContentType
                          type: String
                          description: |-
                            The type of rubric content to be generated.
                            Possible values:
                            PROPERTY
                            NL_QUESTION_ANSWER
                            PYTHON_CODE_ASSERTION
                        - name: rubricTypeOntology
                          type: Array
                          description: |-
                            An optional, pre-defined list of allowed types for generated rubrics.
                            If this field is provided, it implies `include_rubric_type` should be true,
                            and the generated rubric types should be chosen from this ontology.
                          item_type:
                            type: String
                        - name: rubricsParserConfig
                          type: NestedObject
                          description: |-
                            Config for parsing LLM responses.
                            It can be used to parse the LLM response to be evaluated, or the LLM
                            response from LLM-based metrics/Autoraters.
                          properties:
                            - name: customCodeParserConfig
                              type: NestedObject
                              description: Configuration for parsing the LLM response using custom code.
                              properties:
                                - name: parsingFunction
                                  type: String
                                  required: true
                                  description: |-
                                    Python function for parsing results. The function should be defined
                                    within this string.

                                    The function takes a list of strings (LLM responses) and should return
                                    either a list of dictionaries (for rubrics) or a single dictionary
                                    (for a metric result).

                                    Example function signature:
                                    def parse(responses: list[str]) -> list[dict[str, Any]] | dict[str, Any]:

                                    When parsing rubrics, return a list of dictionaries, where each
                                    dictionary represents a Rubric.
                                    Example for rubrics:
                                    [
                                    {
                                    "content": {"property": {"description": "The response is
                                    factual."}},
                                    "type": "FACTUALITY",
                                    "importance": "HIGH"
                                    },
                                    {
                                    "content": {"property": {"description": "The response is
                                    fluent."}},
                                    "type": "FLUENCY",
                                    "importance": "MEDIUM"
                                    }
                                    ]

                                    When parsing critique results, return a dictionary representing a
                                    MetricResult.
                                    Example for a metric result:
                                    {
                                    "score": 0.8,
                                    "explanation": "The model followed most instructions.",
                                    "rubric_verdicts": [...]
                                    }

                                    ... code for result extraction and aggregation
                            - name: jsonParserConfig
                              type: NestedObject
                              description: Configuration for parsing the LLM response using JSON.
                              properties:
                                - name: jsonKeys
                                  type: NestedObject
                                  description: Repeated json keys.
                                  properties:
                                    - name: keys
                                      type: Array
                                      required: true
                                      description: Keys to extract from JSON.
                                      item_type:
                                        type: String
                                - name: schema
                                  type: String
                                  description: The JSON schema to use for validation.
                            - name: regexParserConfig
                              type: NestedObject
                              description: Config for parsing LLM responses using a regular expression.
                              properties:
                                - name: regexPattern
                                  type: String
                                  description: |-
                                    A regular expression to extract data.
                                    For example, if the LLM response is:
                                    "The answer is 42."
                                    and you want to extract the value `42`, you can define the following
                                    regex parser config:
                                    ```
                                    regex_pattern: ".*(.*).*"
                                    ```
                                    This will extract `42` and return it as the parsed result.
                            - name: xmlParserConfig
                              type: NestedObject
                              description: Configuration for parsing the LLM response using XML.
                              properties:
                                - name: schema
                                  type: String
                                  description: The XML schema to use for validation.
                                - name: xmlKeys
                                  type: NestedObject
                                  description: Repeated xml keys.
                                  properties:
                                    - name: keys
                                      type: Array
                                      required: true
                                      description: Keys to extract from XML.
                                      item_type:
                                        type: String
                    - name: rubricGroupKey
                      type: String
                      description: |-
                        Use a pre-defined group of rubrics associated with the input.
                        Refers to a key in the rubric_groups map of EvaluationInstance.
                    - name: systemInstruction
                      type: String
                      description: System instructions for the judge model.
                - name: metadata
                  type: NestedObject
                  description: Metadata about the metric, used for visualization and organization.
                  properties:
                    - name: otherMetadata
                      type: KeyValuePairs
                      description: Flexible metadata for user-defined attributes.
                    - name: scoreRange
                      type: NestedObject
                      description: The range of possible scores for this metric, used for plotting.
                      properties:
                        - name: description
                          type: String
                          description: The description of the score explaining the directionality etc.
                        - name: max
                          type: Double
                          required: true
                          description: The maximum value of the score range (inclusive).
                        - name: min
                          type: Double
                          required: true
                          description: The minimum value of the score range (inclusive).
                        - name: step
                          type: Double
                          description: |-
                            The distance between discrete steps in the range.
                            If unset, the range is assumed to be continuous.
                    - name: title
                      type: String
                      description: |-
                        The user-friendly name for the metric. If not set for a
                        registered metric, it will default to the metric's display name.
                - name: pairwiseMetricSpec
                  type: NestedObject
                  description: Spec for pairwise metric.
                  properties:
                    - name: baselineResponseFieldName
                      type: String
                      description: The field name of the baseline response.
                    - name: candidateResponseFieldName
                      type: String
                      description: The field name of the candidate response.
                    - name: customOutputFormatConfig
                      type: NestedObject
                      description: Spec for custom output format configuration.
                      properties:
                        - name: returnRawOutput
                          type: Boolean
                          description: Whether to return raw output.
                    - name: metricPromptTemplate
                      type: String
                      required: true
                      description: Metric prompt template for pairwise metric.
                    - name: systemInstruction
                      type: String
                      description: System instructions for pairwise metric.
                - name: pointwiseMetricSpec
                  type: NestedObject
                  description: Spec for pointwise metric.
                  properties:
                    - name: customOutputFormatConfig
                      type: NestedObject
                      description: Spec for custom output format configuration.
                      properties:
                        - name: returnRawOutput
                          type: Boolean
                          description: Whether to return raw output.
                    - name: metricPromptTemplate
                      type: String
                      required: true
                      description: Metric prompt template for pointwise metric.
                    - name: systemInstruction
                      type: String
                      description: System instructions for pointwise metric.
                - name: predefinedMetricSpec
                  type: NestedObject
                  description: The spec for a pre-defined metric.
                  properties:
                    - name: metricSpecName
                      type: String
                      required: true
                      description: |-
                        The name of a pre-defined metric, such as "instruction_following_v1" or
                        "text_quality_v1".
                    - name: metricSpecParameters
                      type: KeyValuePairs
                      description: The parameters needed to run the pre-defined metric.
                - name: rougeSpec
                  type: NestedObject
                  description: |-
                    Spec for rouge score metric - calculates the recall of n-grams in prediction
                    as compared to reference - returns a score ranging between 0 and 1.
                  properties:
                    - name: rougeType
                      type: String
                      description: Supported rouge types are rougen[1-9], rougeL, and rougeLsum.
                    - name: splitSummaries
                      type: Boolean
                      description: Whether to split summaries while using rougeLsum.
                    - name: useStemmer
                      type: Boolean
                      description: Whether to use stemmer to compute rouge score.
                - name: translationMetricSpec
                  type: NestedObject
                  description: Specification for a Translation Model based metric.
                  properties:
                    - name: sourceLanguageCode
                      type: String
                      description: Source language in BCP-47 format.
                    - name: targetLanguageCode
                      type: String
                      description: Target language in BCP-47 format. Covers both prediction and reference.
                    - name: version
                      type: String
                      required: true
                      description: |-
                        Possible values:
                        COMET_22_SRC_REF
                        METRICX_24_SRC_REF
                        METRICX_24_SRC
                        METRICX_24_REF
            - name: metricResourceName
              type: String
              description: The resource name of the metric definition.
            - name: predefinedMetricSpec
              type: NestedObject
              description: Specification for a pre-defined metric.
              properties:
                - name: metricSpecName
                  type: String
                  required: true
                  description: |-
                    The name of a pre-defined metric, such as "instruction_following_v1" or
                    "text_quality_v1".
                - name: parameters
                  type: KeyValuePairs
                  description: The parameters needed to run the pre-defined metric.
            - name: rubricBasedMetricSpec
              type: NestedObject
              description: Specification for a metric that is based on rubrics.
              properties:
                - name: inlineRubrics
                  type: NestedObject
                  description: Defines a list of rubrics, used when providing rubrics inline.
                  properties:
                    - name: rubrics
                      type: Array
                      description: The list of rubrics.
                      item_type:
                        type: NestedObject
                        properties:
                          - name: content
                            type: NestedObject
                            description: Content of the rubric, defining the testable criteria.
                            properties:
                              - name: property
                                type: NestedObject
                                description: Defines criteria based on a specific property.
                                properties:
                                  - name: description
                                    type: String
                                    description: |-
                                      Description of the property being evaluated.
                                      Example: "The model's response is grammatically correct."
                          - name: importance
                            type: String
                            description: |-
                              The relative importance of this rubric.
                              Possible values:
                              HIGH
                              MEDIUM
                              LOW
                          - name: rubricId
                            type: String
                            description: |-
                              Unique identifier for the rubric.
                              This ID is used to refer to this rubric, e.g., in RubricVerdict.
                          - name: type
                            type: String
                            description: |-
                              A type designator for the rubric, which can inform how it's
                              evaluated or interpreted by systems or users.
                              It's recommended to use consistent, well-defined, upper snake_case strings.
                              Examples: "SUMMARIZATION_QUALITY", "SAFETY_HARMFUL_CONTENT",
                              "INSTRUCTION_ADHERENCE".
                - name: judgeAutoraterConfig
                  type: NestedObject
                  description: The autorater config used for the evaluation run.
                  properties:
                    - name: autoraterModel
                      type: String
                      description: |-
                        The fully qualified name of the publisher model or tuned autorater
                        endpoint to use.

                        Publisher model format:
                        `projects/{project}/locations/{location}/publishers/*/models/*`

                        Tuned model endpoint format:
                        `projects/{project}/locations/{location}/endpoints/{endpoint}`
                    - name: generationConfig
                      type: NestedObject
                      description: |-
                        Configuration for content generation.

                        This message contains all the parameters that control how the model generates
                        content. It allows you to influence the randomness, length, and structure of
                        the output.
                      properties:
                        - name: audioTimestamp
                          type: Boolean
                          description: |-
                            If enabled, audio timestamps will be included in the request to
                            the model. This can be useful for synchronizing audio with other modalities
                            in the response.
                        - name: candidateCount
                          type: Integer
                          description: |-
                            The number of candidate responses to generate.

                            A higher `candidate_count` can provide more options to choose from, but it
                            also consumes more resources. This can be useful for generating a variety
                            of responses and selecting the best one.
                        - name: contextConfig
                          type: NestedObject
                          description: |-
                            Config related to the context window for the generation request.
                            This may include configurations such as:
                            * Whether we apply sliding window to the historical context,
                            and what is the expected window size.
                            * Whether we include video frames all the time, or only when there is a
                            sentence detected from the audio.
                          properties:
                            - name: videoFrameOnlyDuringAudioActivity
                              type: Boolean
                              description: |-
                                If true, video frames will only be included when there is a sentence
                                detected from the audio.
                        - name: echo
                          type: Boolean
                          description: Echo.
                        - name: enableAffectiveDialog
                          type: Boolean
                          description: |-
                            If enabled, the model will detect emotions and adapt its
                            responses accordingly. For example, if the model detects that the user is
                            frustrated, it may provide a more empathetic response.
                        - name: frequencyPenalty
                          type: Double
                          description: |-
                            Penalizes tokens based on their frequency in the generated text.
                            A positive value helps to reduce the repetition of words and phrases.
                            Valid values can range from [-2.0, 2.0].
                        - name: imageConfig
                          type: NestedObject
                          description: |-
                            Configuration for image generation.

                            This message allows you to control various aspects of image generation, such
                            as the output format, aspect ratio, and whether the model can generate
                            images of people.
                          properties:
                            - name: aspectRatio
                              type: String
                              description: |-
                                The desired aspect ratio for the generated images. The following
                                aspect ratios are supported:

                                "1:1"
                                "2:3", "3:2"
                                "3:4", "4:3"
                                "4:5", "5:4"
                                "9:16", "16:9"
                                "21:9"
                            - name: imageOutputOptions
                              type: NestedObject
                              description: The image output format for generated images.
                              properties:
                                - name: compressionQuality
                                  type: Integer
                                  description: The compression quality of the output image.
                                - name: mimeType
                                  type: String
                                  description: The image format that the output should be saved as.
                            - name: imageSize
                              type: String
                              description: |-
                                Specifies the size of generated images. Supported values are `1K`, `2K`,
                                `4K`. If not specified, the model will use default value `1K`.
                            - name: personGeneration
                              type: String
                              description: |-
                                Controls whether the model can generate people.
                                Possible values:
                                ALLOW_ALL
                                ALLOW_ADULT
                                ALLOW_NONE
                            - name: prominentPeople
                              type: String
                              description: |-
                                Controls whether prominent people (celebrities) generation is allowed. If
                                used with personGeneration, personGeneration enum would take precedence.
                                For instance, if ALLOW_NONE is set, all person generation would be blocked.
                                If this field is unspecified, the default behavior is to allow prominent
                                people.
                                Possible values:
                                ALLOW_PROMINENT_PEOPLE
                                BLOCK_PROMINENT_PEOPLE
                        - name: logitBias
                          type: KeyValuePairs
                          description: |-
                            A map that allows you to adjust the probability of specific
                            tokens being generated. Each key is a token (as a string), and the
                            value is a bias (a float). A positive bias increases the likelihood
                            of the token appearing in the output, while a negative bias
                            decreases it. This can be used to guide the model's output and
                            prevent it from generating certain words.
                        - name: logprobs
                          type: Integer
                          description: |-
                            The number of top log probabilities to return for each token.

                            This can be used to see which other tokens were considered likely
                            candidates for a given position. A higher value will return more options,
                            but it will also increase the size of the response.
                        - name: maxOutputTokens
                          type: Integer
                          description: |-
                            The maximum number of tokens to generate in the response.

                            A token is approximately four characters. The default value varies by
                            model. This parameter can be used to control the length of the generated
                            text and prevent overly long responses.
                        - name: mediaResolution
                          type: String
                          description: |-
                            The token resolution at which input media content is sampled. This is
                            used to control the trade-off between the quality of the response and the
                            number of tokens used to represent the media. A higher resolution allows
                            the model to perceive more detail, which can lead to a more nuanced
                            response, but it will also use more tokens. This does not affect the
                            image dimensions sent to the model.
                            Possible values:
                            MEDIA_RESOLUTION_LOW
                            MEDIA_RESOLUTION_MEDIUM
                            MEDIA_RESOLUTION_HIGH
                        - name: minP
                          type: Double
                          description: If specified, min-p sampling will be used.
                        - name: presencePenalty
                          type: Double
                          description: |-
                            Penalizes tokens that have already appeared in the generated
                            text. A positive value encourages the model to generate more diverse and
                            less repetitive text. Valid values can range from [-2.0, 2.0].
                        - name: requestLogprobs
                          type: Boolean
                          description: When set to true, return logprobs for the request itself.
                        - name: requestLogprobsConfig
                          type: NestedObject
                          description: Configuration to control request logprobs.
                          properties:
                            - name: skipBos
                              type: Boolean
                              description: |-
                                When set to true, skip prepending '' at the beginning of the input
                                prompt.
                            - name: skipEos
                              type: Boolean
                              description: When set to true, skip appending '' to the end of the input prompt.
                        - name: requestTopKLogprobs
                          type: Integer
                          description: Return top-k logprobs for the input request.
                        - name: responseJsonSchema
                          type: NestedObject
                          description: |-
                            When this field is set,
                            response_schema
                            must be omitted and
                            response_mime_type
                            must be set to `application/json`.
                          properties: []
                        - name: responseLogprobs
                          type: Boolean
                          description: |-
                            If set to true, the log probabilities of the output tokens are
                            returned.

                            Log probabilities are the logarithm of the probability of a token appearing
                            in the output. A higher log probability means the token is more likely to
                            be generated. This can be useful for analyzing the model's confidence in
                            its own output and for debugging.
                        - name: responseMimeType
                          type: String
                          description: |-
                            The IANA standard MIME type of the response. The model will
                            generate output that conforms to this MIME type. Supported values include
                            'text/plain' (default) and 'application/json'. The model needs to be
                            prompted to output the appropriate response type, otherwise the behavior is
                            undefined.
                        - name: responseModalities
                          type: Array
                          description: |-
                            The modalities of the response. The model will generate a
                            response that includes all the specified modalities. For example, if this
                            is set to `[TEXT, IMAGE]`, the response will include both text and an
                            image.
                          item_type:
                            type: String
                        - name: responseRegexConstraint
                          type: String
                          description: |-
                            Regex constraint for the generated response.

                            If set, `response_schema` or `response_json_schema` must be omitted.
                        - name: responseSchema
                          type: NestedObject
                          description: Defines the schema of input and output data.
                          properties:
                            - name: description
                              type: String
                              description: No description
                            - name: format
                              type: String
                              description: No description
                            - name: type
                              type: String
                              description: No description
                        - name: routingConfig
                          type: NestedObject
                          description: |-
                            The configuration for routing the request to a specific model.
                            This can be used to control which model is used for the generation, either
                            automatically or by specifying a model name.
                          properties:
                            - name: autoMode
                              type: NestedObject
                              description: |-
                                The configuration for automated routing.

                                When automated routing is specified, the routing will be determined by
                                the pretrained routing model and customer provided model routing
                                preference.
                              properties:
                                - name: modelRoutingPreference
                                  type: String
                                  description: |-
                                    The model routing preference.
                                    Possible values:
                                    UNKNOWN
                                    PRIORITIZE_QUALITY
                                    BALANCED
                                    PRIORITIZE_COST
                            - name: manualMode
                              type: NestedObject
                              description: |-
                                The configuration for manual routing.

                                When manual routing is specified, the model will be selected based on the
                                model name provided.
                              properties:
                                - name: modelName
                                  type: String
                                  description: The name of the model to use. Only public LLM models are accepted.
                        - name: seed
                          type: Integer
                          description: |-
                            A seed for the random number generator.

                            By setting a seed, you can make the model's output mostly deterministic.
                            For a given prompt and parameters (like temperature, top_p, etc.), the
                            model will produce the same response every time. However, it's not a
                            guaranteed absolute deterministic behavior. This is different from
                            parameters like `temperature`, which control the *level* of randomness.
                            `seed` ensures that the "random" choices the model makes are the same on
                            every run, making it essential for testing and ensuring reproducible
                            results.
                        - name: speechConfig
                          type: NestedObject
                          description: Configuration for speech generation.
                          properties:
                            - name: languageCode
                              type: String
                              description: The language code (ISO 639-1) for the speech synthesis.
                            - name: multiSpeakerVoiceConfig
                              type: NestedObject
                              description: Configuration for a multi-speaker text-to-speech request.
                              properties:
                                - name: speakerVoiceConfigs
                                  type: Array
                                  required: true
                                  description: |-
                                    A list of configurations for the voices of the speakers. Exactly
                                    two speaker voice configurations must be provided.
                                  item_type:
                                    type: NestedObject
                                    properties:
                                      - name: speaker
                                        type: String
                                        required: true
                                        description: |-
                                          The name of the speaker. This should be the same as the speaker
                                          name used in the prompt.
                                      - name: voiceConfig
                                        type: NestedObject
                                        required: true
                                        description: Configuration for a voice.
                                        properties:
                                          - name: customVoiceConfig
                                            type: NestedObject
                                            description: Configuration for a custom voice.
                                            properties:
                                              - name: customVoiceSample
                                                type: String
                                                description: The audio sample of the custom voice, in PCM16/s16le format.
                                          - name: prebuiltVoiceConfig
                                            type: NestedObject
                                            description: Configuration for a prebuilt voice.
                                            properties:
                                              - name: voiceName
                                                type: String
                                                description: The name of the prebuilt voice to use.
                                          - name: replicatedVoiceConfig
                                            type: NestedObject
                                            description: The configuration for the replicated voice to use.
                                            properties:
                                              - name: consentAudio
                                                type: String
                                                description: |-
                                                  Input only. The recorded consent verifying ownership of the voice. This represents
                                                  16-bit signed little-endian wav data, with a 24kHz sampling rate.
                                              - name: mimeType
                                                type: String
                                                description: |-
                                                  The mimetype of the voice sample. The only currently supported value is
                                                  `audio/wav`.
                                                  This represents 16-bit signed little-endian wav data, with a 24kHz
                                                  sampling rate.
                                                  `mime_type` will default to `audio/wav` if not set.
                                              - name: voiceSampleAudio
                                                type: String
                                                description: The sample of the custom voice.
                            - name: voiceConfig
                              type: NestedObject
                              description: Configuration for a voice.
                              properties:
                                - name: customVoiceConfig
                                  type: NestedObject
                                  description: Configuration for a custom voice.
                                  properties:
                                    - name: customVoiceSample
                                      type: String
                                      description: The audio sample of the custom voice, in PCM16/s16le format.
                                - name: prebuiltVoiceConfig
                                  type: NestedObject
                                  description: Configuration for a prebuilt voice.
                                  properties:
                                    - name: voiceName
                                      type: String
                                      description: The name of the prebuilt voice to use.
                                - name: replicatedVoiceConfig
                                  type: NestedObject
                                  description: The configuration for the replicated voice to use.
                                  properties:
                                    - name: consentAudio
                                      type: String
                                      description: |-
                                        Input only. The recorded consent verifying ownership of the voice. This represents
                                        16-bit signed little-endian wav data, with a 24kHz sampling rate.
                                    - name: mimeType
                                      type: String
                                      description: |-
                                        The mimetype of the voice sample. The only currently supported value is
                                        `audio/wav`.
                                        This represents 16-bit signed little-endian wav data, with a 24kHz
                                        sampling rate.
                                        `mime_type` will default to `audio/wav` if not set.
                                    - name: voiceSampleAudio
                                      type: String
                                      description: The sample of the custom voice.
                        - name: stopSequences
                          type: Array
                          description: |-
                            A list of character sequences that will stop the model from
                            generating further tokens. If a stop sequence is generated, the output
                            will end at that point. This is useful for controlling the length and
                            structure of the output. For example, you can use ["\n", "###"] to stop
                            generation at a new line or a specific marker.
                          item_type:
                            type: String
                        - name: temperature
                          type: Double
                          description: |-
                            Controls the randomness of the output. A higher temperature
                            results in more creative and diverse responses, while a lower temperature
                            makes the output more predictable and focused. The valid range is (0.0,
                            2.0].
                        - name: thinkingConfig
                          type: NestedObject
                          description: |-
                            Configuration for the model's thinking features.

                            "Thinking" is a process where the model breaks down a complex task into
                            smaller, manageable steps. This allows the model to reason about the task,
                            plan its approach, and execute the plan to generate a high-quality
                            response.
                          properties:
                            - name: includeThoughts
                              type: Boolean
                              description: |-
                                If true, the model will include its thoughts in the response. "Thoughts"
                                are the intermediate steps the model takes to arrive at the final
                                response. They can provide insights into the model's reasoning process
                                and help with debugging. If this is true, thoughts are returned only when
                                available.
                            - name: thinkingBudget
                              type: Integer
                              description: |-
                                The token budget for the model's thinking process. The model will make a
                                best effort to stay within this budget. This can be used to control the
                                trade-off between response quality and latency.
                            - name: thinkingLevel
                              type: String
                              description: |-
                                The number of thoughts tokens that the model should generate.
                                Possible values:
                                LOW
                                MEDIUM
                                HIGH
                                MINIMAL
                        - name: topK
                          type: Double
                          description: |-
                            Specifies the top-k sampling threshold. The model considers only
                            the top k most probable tokens for the next token. This can be useful for
                            generating more coherent and less random text. For example, a `top_k` of 40
                            means the model will choose the next word from the 40 most likely words.
                        - name: topP
                          type: Double
                          description: |-
                            Specifies the nucleus sampling threshold. The model considers
                            only the smallest set of tokens whose cumulative probability is at least
                            `top_p`. This helps generate more diverse and less repetitive responses.
                            For example, a `top_p` of 0.9 means the model considers tokens until the
                            cumulative probability of the tokens to select from reaches 0.9. It's
                            recommended to adjust either temperature or `top_p`, but not both.
                    - name: sampleCount
                      type: Integer
                      description: |-
                        Number of samples for each instance in the dataset.
                        If not specified, the default is 4. Minimum value is 1, maximum value
                        is 32.
                - name: metricPromptTemplate
                  type: String
                  description: |-
                    Template for the prompt used by the judge model to evaluate against
                    rubrics.
                - name: rubricGenerationSpec
                  type: NestedObject
                  description: Specification for how rubrics should be generated.
                  properties:
                    - name: metricResourceName
                      type: String
                      description: Resource name of the metric definition.
                    - name: modelConfig
                      type: NestedObject
                      description: The autorater config used for the evaluation run.
                      properties:
                        - name: autoraterModel
                          type: String
                          description: |-
                            The fully qualified name of the publisher model or tuned autorater
                            endpoint to use.

                            Publisher model format:
                            `projects/{project}/locations/{location}/publishers/*/models/*`

