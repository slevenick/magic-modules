        type: Array
        description: |-
          The rubric configs for the evaluation run. They are used to generate
          rubrics which can be used by rubric-based metrics. Multiple rubric
          configs can be specified for rubric generation but only one rubric config
          can be used for a rubric-based metric. If more than one rubric config is
          provided, the evaluation metric must specify a rubric group key. Note
