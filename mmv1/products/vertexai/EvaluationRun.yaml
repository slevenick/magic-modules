                              type: Boolean
                              description: |-
                                If enabled, audio timestamps will be included in the request to
                                the model. This can be useful for synchronizing audio with other modalities
                                in the response.
                            - name: candidateCount
                              type: Integer
                              description: |-
                                The number of candidate responses to generate.

                                A higher `candidate_count` can provide more options to choose from, but it
                                also consumes more resources. This can be useful for generating a variety
                                of responses and selecting the best one.
                            - name: contextConfig
                              type: NestedObject
                              description: |-
                                Config related to the context window for the generation request.
                                This may include configurations such as:
                                * Whether we apply sliding window to the historical context,
                                and what is the expected window size.
                                * Whether we include video frames all the time, or only when there is a
                                sentence detected from the audio.
                              properties:
                                - name: videoFrameOnlyDuringAudioActivity
                                  type: Boolean
                                  description: |-
                                    If true, video frames will only be included when there is a sentence
                                    detected from the audio.
                            - name: echo
                              type: Boolean
                              description: Echo.
                            - name: enableAffectiveDialog
                              type: Boolean
                              description: |-
                                If enabled, the model will detect emotions and adapt its
                                responses accordingly. For example, if the model detects that the user is
                                frustrated, it may provide a more empathetic response.
                            - name: frequencyPenalty
                              type: Double
                              description: |-
                                Penalizes tokens based on their frequency in the generated text.
                                A positive value helps to reduce the repetition of words and phrases.
                                Valid values can range from [-2.0, 2.0].
                            - name: imageConfig
                              type: NestedObject
                              description: |-
                                Configuration for image generation.

                                This message allows you to control various aspects of image generation, such
                                as the output format, aspect ratio, and whether the model can generate
                                images of people.
                              properties:
                                - name: aspectRatio
                                  type: String
                                  description: |-
                                    The desired aspect ratio for the generated images. The following
                                    aspect ratios are supported:

                                    "1:1"
                                    "2:3", "3:2"
                                    "3:4", "4:3"
                                    "4:5", "5:4"
                                    "9:16", "16:9"
                                    "21:9"
                                - name: imageOutputOptions
                                  type: NestedObject
                                  description: The image output format for generated images.
                                  properties:
                                    - name: compressionQuality
                                      type: Integer
                                      description: The compression quality of the output image.
                                    - name: mimeType
                                      type: String
                                      description: The image format that the output should be saved as.
                                - name: imageSize
                                  type: String
                                  description: |-
                                    Specifies the size of generated images. Supported values are `1K`, `2K`,
                                    `4K`. If not specified, the model will use default value `1K`.
                                - name: personGeneration
                                  type: String
                                  description: |-
                                    Controls whether the model can generate people.
                                    Possible values:
                                    ALLOW_ALL
                                    ALLOW_ADULT
                                    ALLOW_NONE
                                - name: prominentPeople
                                  type: String
                                  description: |-
                                    Controls whether prominent people (celebrities) generation is allowed. If
                                    used with personGeneration, personGeneration enum would take precedence.
                                    For instance, if ALLOW_NONE is set, all person generation would be blocked.
                                    If this field is unspecified, the default behavior is to allow prominent
                                    people.
                                    Possible values:
                                    ALLOW_PROMINENT_PEOPLE
                                    BLOCK_PROMINENT_PEOPLE
                            - name: logitBias
                              type: KeyValuePairs
                              description: |-
                                A map that allows you to adjust the probability of specific
                                tokens being generated. Each key is a token (as a string), and the
                                value is a bias (a float). A positive bias increases the likelihood
                                of the token appearing in the output, while a negative bias
                                decreases it. This can be used to guide the model's output and
                                prevent it from generating certain words.
                            - name: logprobs
                              type: Integer
                              description: |-
                                The number of top log probabilities to return for each token.

                                This can be used to see which other tokens were considered likely
                                candidates for a given position. A higher value will return more options,
                                but it will also increase the size of the response.
                            - name: maxOutputTokens
                              type: Integer
                              description: |-
                                The maximum number of tokens to generate in the response.

                                A token is approximately four characters. The default value varies by
                                model. This parameter can be used to control the length of the generated
                                text and prevent overly long responses.
                            - name: mediaResolution
                              type: String
                              description: |-
                                The token resolution at which input media content is sampled. This is
                                used to control the trade-off between the quality of the response and the
                                number of tokens used to represent the media. A higher resolution allows
                                the model to perceive more detail, which can lead to a more nuanced
                                response, but it will also use more tokens. This does not affect the
                                image dimensions sent to the model.
                                Possible values:
                                MEDIA_RESOLUTION_LOW
                                MEDIA_RESOLUTION_MEDIUM
                                MEDIA_RESOLUTION_HIGH
                            - name: minP
                              type: Double
                              description: If specified, min-p sampling will be used.
                            - name: presencePenalty
                              type: Double
                              description: |-
                                Penalizes tokens that have already appeared in the generated
                                text. A positive value encourages the model to generate more diverse and
                                less repetitive text. Valid values can range from [-2.0, 2.0].
                            - name: requestLogprobs
                              type: Boolean
                              description: When set to true, return logprobs for the request itself.
                            - name: requestLogprobsConfig
                              type: NestedObject
                              description: Configuration to control request logprobs.
                              properties:
                                - name: skipBos
                                  type: Boolean
                                  description: |-
                                    When set to true, skip prepending '' at the beginning of the input
                                    prompt.
                                - name: skipEos
                                  type: Boolean
                                  description: When set to true, skip appending '' to the end of the input prompt.
                            - name: requestTopKLogprobs
                              type: Integer
                              description: Return top-k logprobs for the input request.
                            - name: responseJsonSchema
                              type: NestedObject
                              description: |-
                                When this field is set,
                                response_schema
                                must be omitted and
                                response_mime_type
                                must be set to `application/json`.
                              properties: []
                            - name: responseLogprobs
                              type: Boolean
                              description: |-
