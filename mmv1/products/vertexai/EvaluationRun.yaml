                              type: NestedObject
                              description: Configuration for a multi-speaker text-to-speech request.
                              properties:
                                - name: speakerVoiceConfigs
                                  type: Array
                                  required: true
                                  description: |-
                                    A list of configurations for the voices of the speakers. Exactly
                                    two speaker voice configurations must be provided.
                                  item_type:
                                    type: NestedObject
                                    properties:
                                      - name: speaker
                                        type: String
                                        required: true
                                        description: |-
                                          The name of the speaker. This should be the same as the speaker
                                          name used in the prompt.
                                      - name: voiceConfig
                                        type: NestedObject
                                        required: true
                                        description: Configuration for a voice.
                                        properties:
                                          - name: customVoiceConfig
                                            type: NestedObject
                                            description: Configuration for a custom voice.
                                            properties:
                                              - name: customVoiceSample
                                                type: String
                                                description: The audio sample of the custom voice, in PCM16/s16le format.
                                          - name: prebuiltVoiceConfig
                                            type: NestedObject
                                            description: Configuration for a prebuilt voice.
                                            properties:
                                              - name: voiceName
                                                type: String
                                                description: The name of the prebuilt voice to use.
                                          - name: replicatedVoiceConfig
                                            type: NestedObject
                                            description: The configuration for the replicated voice to use.
                                            properties:
                                              - name: consentAudio
                                                type: String
                                                description: |-
                                                  Input only. The recorded consent verifying ownership of the voice. This represents
                                                  16-bit signed little-endian wav data, with a 24kHz sampling rate.
                                              - name: mimeType
                                                type: String
                                                description: |-
                                                  The mimetype of the voice sample. The only currently supported value is
                                                  `audio/wav`.
                                                  This represents 16-bit signed little-endian wav data, with a 24kHz
                                                  sampling rate.
                                                  `mime_type` will default to `audio/wav` if not set.
                                              - name: voiceSampleAudio
                                                type: String
                                                description: The sample of the custom voice.
                            - name: voiceConfig
                              type: NestedObject
                              description: Configuration for a voice.
                              properties:
                                - name: customVoiceConfig
                                  type: NestedObject
                                  description: Configuration for a custom voice.
                                  properties:
                                    - name: customVoiceSample
                                      type: String
                                      description: The audio sample of the custom voice, in PCM16/s16le format.
                                - name: prebuiltVoiceConfig
                                  type: NestedObject
                                  description: Configuration for a prebuilt voice.
                                  properties:
                                    - name: voiceName
                                      type: String
                                      description: The name of the prebuilt voice to use.
                                - name: replicatedVoiceConfig
                                  type: NestedObject
                                  description: The configuration for the replicated voice to use.
                                  properties:
                                    - name: consentAudio
                                      type: String
                                      description: |-
                                        Input only. The recorded consent verifying ownership of the voice. This represents
                                        16-bit signed little-endian wav data, with a 24kHz sampling rate.
                                    - name: mimeType
                                      type: String
                                      description: |-
                                        The mimetype of the voice sample. The only currently supported value is
                                        `audio/wav`.
                                        This represents 16-bit signed little-endian wav data, with a 24kHz
                                        sampling rate.
                                        `mime_type` will default to `audio/wav` if not set.
                                    - name: voiceSampleAudio
                                      type: String
                                      description: The sample of the custom voice.
                        - name: stopSequences
                          type: Array
                          description: |-
                            A list of character sequences that will stop the model from
                            generating further tokens. If a stop sequence is generated, the output
                            will end at that point. This is useful for controlling the length and
                            structure of the output. For example, you can use ["\n", "###"] to stop
                            generation at a new line or a specific marker.
                          item_type:
                            type: String
                        - name: temperature
                          type: Double
                          description: |-
                            Controls the randomness of the output. A higher temperature
                            results in more creative and diverse responses, while a lower temperature
                            makes the output more predictable and focused. The valid range is (0.0,
                            2.0].
                        - name: thinkingConfig
                          type: NestedObject
                          description: |-
                            Configuration for the model's thinking features.

                            "Thinking" is a process where the model breaks down a complex task into
                            smaller, manageable steps. This allows the model to reason about the task,
                            plan its approach, and execute the plan to generate a high-quality
                            response.
                          properties:
                            - name: includeThoughts
                              type: Boolean
                              description: |-
                                If true, the model will include its thoughts in the response. "Thoughts"
                                are the intermediate steps the model takes to arrive at the final
                                response. They can provide insights into the model's reasoning process
                                and help with debugging. If this is true, thoughts are returned only when
                                available.
                            - name: thinkingBudget
                              type: Integer
                              description: |-
                                The token budget for the model's thinking process. The model will make a
                                best effort to stay within this budget. This can be used to control the
                                trade-off between response quality and latency.
                            - name: thinkingLevel
                              type: String
                              description: |-
                                The number of thoughts tokens that the model should generate.
                                Possible values:
                                LOW
                                MEDIUM
                                HIGH
                                MINIMAL
                        - name: topK
                          type: Double
                          description: |-
                            Specifies the top-k sampling threshold. The model considers only
                            the top k most probable tokens for the next token. This can be useful for
                            generating more coherent and less random text. For example, a `top_k` of 40
                            means the model will choose the next word from the 40 most likely words.
                        - name: topP
                          type: Double
                          description: |-
                            Specifies the nucleus sampling threshold. The model considers
                            only the smallest set of tokens whose cumulative probability is at least
                            `top_p`. This helps generate more diverse and less repetitive responses.
                            For example, a `top_p` of 0.9 means the model considers tokens until the
                            cumulative probability of the tokens to select from reaches 0.9. It's
                            recommended to adjust either temperature or `top_p`, but not both.
                    - name: sampleCount
                      type: Integer
                      description: |-
                        Number of samples for each instance in the dataset.
                        If not specified, the default is 4. Minimum value is 1, maximum value
                        is 32.
                - name: promptTemplate
                  type: String
                  description: |-
                    Template for the prompt used to generate rubrics.
                    The details should be updated based on the most-recent recipe
                    requirements.
                - name: rubricContentType
                  type: String
                  description: |-
                    The type of rubric content to be generated.
                    Possible values:
                    PROPERTY
                    NL_QUESTION_ANSWER
                    PYTHON_CODE_ASSERTION
                - name: rubricTypeOntology
                  type: Array
                  description: |-
                    An optional, pre-defined list of allowed types for generated rubrics.
                    If this field is provided, it implies `include_rubric_type` should be
                    true, and the generated rubric types should be chosen from this ontology.
                  item_type:
                    type: String
            - name: rubricGroupKey
              type: String
              required: true
              description: |-
                The key used to save the generated rubrics.
                If a generation spec is provided, this key will be used for the name of the
                generated rubric group. Otherwise, this key will be used to look up the
                existing rubric group on the evaluation item. Note that if a rubric group
                key is specified on both a rubric config and an evaluation metric, the
                key from the metric will be used to select the rubrics for evaluation.
  - name: evaluationExperiment
    type: String
    description: |-
      The resource name of the evaluation experiment for the evaluation run.
      Setting the evaluation experiment will add the run to the experiment.
      Multiple runs can be added to the same experiment.
      Format:
      `projects/{project}/locations/{location}/evaluationExperiments/{evaluation_experiment}`
  - name: evaluationResults
    type: NestedObject
    output: true
    description: The results of the evaluation run.
    properties:
      - name: evaluationSet
        type: String
        diff_suppress_func: tpgresource.ProjectNumberDiffSuppress
        description: The evaluation set where item level results are stored.
      - name: summaryMetrics
        type: NestedObject
        description: The summary metrics for the evaluation run.
        properties:
          - name: failedItems
            type: Integer
            description: The number of items that failed to be evaluated.
          - name: metrics
            type: KeyValuePairs
            description: Map of metric name to metric value.
          - name: totalItems
            type: Integer
            description: The total number of items that were evaluated.
  - name: evaluationSetSnapshot
    type: String
    description: |-
      The specific evaluation set of the evaluation run. For runs with an
      evaluation set input, this will be that same set. For runs with
      BigQuery input, it's the sampled BigQuery dataset.
    output: true
  - name: gcsUri
    type: String
    description: |-
      The Cloud Storage object where the inference and evaluation configs are
      stored. Specifically, an EvaluationRun with only the configs populated is
      stored in this Cloud Storage object and the configs are merged with the
      metadata to create the full EvaluationRun when it is accessed. If this
      field is not set the configs are stored with the evaluation run metadata.
      Removing the Cloud Storage object will effectively invalidate the
      evaluation run.
      Format: "gs://my-bucket/file-name.txt".
  - name: inferenceConfigs
    type: Map
    description: |-
      The candidate to inference config map for the evaluation run.
      The candidate can be up to 128 characters long and can consist of any UTF-8
      characters.
    value_type:
      type: NestedObject
      properties:
        - name: agentRunConfig
          type: NestedObject
          description: Configuration for Agent Run.
          properties:
            - name: agentEngine
              type: String
              description: |-
                The resource name of the Agent Engine.
                Format:
                projects/{project}/locations/{location}/reasoningEngines/{reasoning_engine}
                For example:
                projects/123/locations/us-central1/reasoningEngines/456
            - name: sessionInput
              type: NestedObject
              description: Session input to run an Agent.
              properties:
                - name: parameters
                  type: KeyValuePairs
                  description: |-
                    Additional parameters for the session, like app_name, etc.
                    For example, {"app_name": "my-app"}.
                - name: sessionState
                  type: KeyValuePairs
                  description: Session specific memory which stores key conversation points.
                - name: userId
                  type: String
                  description: |-
                    The user id for the agent session.
                    The ID can be up to 128 characters long.
            - name: userSimulatorConfig
              type: NestedObject
              description: |-
                Used for multi-turn agent scraping. Contains configuration for
                a user simulator that uses an LLM to generate messages
                on behalf of the user.
              properties:
                - name: maxTurn
                  type: Integer
                  description: |-
                    Maximum number of invocations allowed by the multi-turn agent
                    scraping. This property allows us to stop a run-off conversation,
                    where the agent and the user simulator get into a never ending loop.
                    The initial fixed prompt is also counted as an invocation.
                - name: modelConfig
                  type: NestedObject
                  description: |-
                    Configuration for content generation.

                    This message contains all the parameters that control how the model generates
                    content. It allows you to influence the randomness, length, and structure of
                    the output.
                  properties:
                    - name: audioTimestamp
                      type: Boolean
                      description: |-
                        If enabled, audio timestamps will be included in the request to
                        the model. This can be useful for synchronizing audio with other modalities
                        in the response.
                    - name: candidateCount
                      type: Integer
                      description: |-
                        The number of candidate responses to generate.

                        A higher `candidate_count` can provide more options to choose from, but it
                        also consumes more resources. This can be useful for generating a variety
                        of responses and selecting the best one.
                    - name: contextConfig
                      type: NestedObject
                      description: |-
                        Config related to the context window for the generation request.
                        This may include configurations such as:
                        * Whether we apply sliding window to the historical context,
                        and what is the expected window size.
                        * Whether we include video frames all the time, or only when there is a
                        sentence detected from the audio.
                      properties:
                        - name: videoFrameOnlyDuringAudioActivity
                          type: Boolean
                          description: |-
                            If true, video frames will only be included when there is a sentence
                            detected from the audio.
                    - name: echo
                      type: Boolean
                      description: Echo.
                    - name: enableAffectiveDialog
                      type: Boolean
                      description: |-
                        If enabled, the model will detect emotions and adapt its
                        responses accordingly. For example, if the model detects that the user is
                        frustrated, it may provide a more empathetic response.
                    - name: frequencyPenalty
                      type: Double
                      description: |-
                        Penalizes tokens based on their frequency in the generated text.
                        A positive value helps to reduce the repetition of words and phrases.
                        Valid values can range from [-2.0, 2.0].
                    - name: imageConfig
                      type: NestedObject
                      description: |-
                        Configuration for image generation.

                        This message allows you to control various aspects of image generation, such
                        as the output format, aspect ratio, and whether the model can generate
                        images of people.
                      properties:
                        - name: aspectRatio
                          type: String
                          description: |-
                            The desired aspect ratio for the generated images. The following
                            aspect ratios are supported:

                            "1:1"
                            "2:3", "3:2"
                            "3:4", "4:3"
                            "4:5", "5:4"
                            "9:16", "16:9"
                            "21:9"
                        - name: imageOutputOptions
                          type: NestedObject
                          description: The image output format for generated images.
                          properties:
                            - name: compressionQuality
                              type: Integer
                              description: The compression quality of the output image.
                            - name: mimeType
                              type: String
                              description: The image format that the output should be saved as.
                        - name: imageSize
                          type: String
                          description: |-
                            Specifies the size of generated images. Supported values are `1K`, `2K`,
                            `4K`. If not specified, the model will use default value `1K`.
                        - name: personGeneration
                          type: String
                          description: |-
                            Controls whether the model can generate people.
                            Possible values:
                            ALLOW_ALL
                            ALLOW_ADULT
                            ALLOW_NONE
                        - name: prominentPeople
                          type: String
                          description: |-
                            Controls whether prominent people (celebrities) generation is allowed. If
                            used with personGeneration, personGeneration enum would take precedence.
                            For instance, if ALLOW_NONE is set, all person generation would be blocked.
                            If this field is unspecified, the default behavior is to allow prominent
                            people.
                            Possible values:
                            ALLOW_PROMINENT_PEOPLE
                            BLOCK_PROMINENT_PEOPLE
                    - name: logitBias
                      type: KeyValuePairs
                      description: |-
                        A map that allows you to adjust the probability of specific
                        tokens being generated. Each key is a token (as a string), and the
                        value is a bias (a float). A positive bias increases the likelihood
                        of the token appearing in the output, while a negative bias
                        decreases it. This can be used to guide the model's output and
                        prevent it from generating certain words.
                    - name: logprobs
                      type: Integer
                      description: |-
                        The number of top log probabilities to return for each token.

                        This can be used to see which other tokens were considered likely
                        candidates for a given position. A higher value will return more options,
                        but it will also increase the size of the response.
                    - name: maxOutputTokens
                      type: Integer
                      description: |-
                        The maximum number of tokens to generate in the response.

                        A token is approximately four characters. The default value varies by
                        model. This parameter can be used to control the length of the generated
                        text and prevent overly long responses.
                    - name: mediaResolution
                      type: String
                      description: |-
                        The token resolution at which input media content is sampled. This is
                        used to control the trade-off between the quality of the response and the
                        number of tokens used to represent the media. A higher resolution allows
                        the model to perceive more detail, which can lead to a more nuanced
                        response, but it will also use more tokens. This does not affect the
                        image dimensions sent to the model.
                        Possible values:
                        MEDIA_RESOLUTION_LOW
                        MEDIA_RESOLUTION_MEDIUM
                        MEDIA_RESOLUTION_HIGH
                    - name: minP
                      type: Double
                      description: If specified, min-p sampling will be used.
                    - name: presencePenalty
                      type: Double
                      description: |-
                        Penalizes tokens that have already appeared in the generated
                        text. A positive value encourages the model to generate more diverse and
                        less repetitive text. Valid values can range from [-2.0, 2.0].
                    - name: requestLogprobs
                      type: Boolean
                      description: When set to true, return logprobs for the request itself.
                    - name: requestLogprobsConfig
                      type: NestedObject
                      description: Configuration to control request logprobs.
                      properties:
                        - name: skipBos
                          type: Boolean
                          description: |-
