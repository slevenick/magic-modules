                - name: computationBasedMetricSpec
                  type: NestedObject
                  description: Specification for a computation based metric.
                  properties:
                    - name: parameters
                      type: KeyValuePairs
                      description: 'A map of parameters for the metric, e.g. {"rouge_type": "rougeL"}.'
                    - name: type
                      type: String
