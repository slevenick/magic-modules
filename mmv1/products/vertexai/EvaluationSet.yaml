---
name: EvaluationSet
description: Description
base_url: projects/{{project}}/locations/{{region}}/evaluationSets
self_link: projects/{{project}}/locations/{{region}}/evaluationSets/{{name}}
create_url: projects/{{project}}/locations/{{region}}/evaluationSets
update_mask: true
update_verb: PATCH
import_format:
  - projects/{{project}}/locations/{{region}}/evaluationSets/{{name}}
async:
  type: OpAsync
  operation:
    base_url: projects/{{project}}/locations/{{region}}/evaluationSets
  actions:
    - delete
  result:
    resource_inside_response: true
autogen_status: RXZhbHVhdGlvblNldEF1dG9nZW5WMkFnZW50
samples:
  - name: vertex_ai_evaluation_set_basic
    primary_resource_id: basic_set
    steps:
      - name: vertex_ai_evaluation_set_basic
  - name: vertex_ai_evaluation_set_full
    primary_resource_id: full_set
    steps:
      - name: vertex_ai_evaluation_set_full
parameters:
  - name: region
    type: String
    description: The region of the resource. eg us-central1
    immutable: true
    url_param_only: true
properties:
  - name: createTime
    type: String
    description: Timestamp when this item was created.
    output: true
  - name: displayName
    type: String
    required: true
    description: The display name of the EvaluationSet.
  - name: evaluationItems
    type: Array
    required: true
    diff_suppress_func: tpgresource.ProjectNumberDiffSuppress
    description: The EvaluationItems that are part of this dataset.
    item_type:
      type: String
  - name: labels
    type: KeyValueLabels
    description: Labels for the EvaluationSet.
  - name: metadata
    type: KeyValuePairs
    description: Metadata for the EvaluationSet.
  - name: name
    type: String
    custom_flatten: templates/terraform/custom_flatten/name_from_self_link.tmpl
    description: |-
      Identifier. The resource name of the EvaluationSet.
      Format:
      `projects/{project}/locations/{location}/evaluationSets/{evaluation_set}`
    output: true
  - name: updateTime
    type: String
    description: Timestamp when this item was last updated.
    output: true
